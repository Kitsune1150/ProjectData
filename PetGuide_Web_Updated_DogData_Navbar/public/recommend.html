<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ค้นหาสัตว์ที่เหมาะกับฉัน | PetGuide</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <nav class="site-navbar">
        <div class="nav-inner">
          <a class="brand" href="index.html"
            ><span class="brand-mark">🐾</span
            ><span
              ><strong>PetGuide</strong
              ><small>คู่มือเลือกสัตว์เลี้ยง</small></span
            ></a
          >
          <button
            class="nav-toggle"
            type="button"
            aria-label="เปิดเมนู"
            onclick="document.body.classList.toggle('nav-open')"
          >
            <span></span><span></span><span></span>
          </button>
          <div class="nav-menu">
            <div class="nav-main">
              <a href="index.html">หน้าแรก</a><a href="pets.html">สายพันธุ์</a
              ><a href="recommend.html">ช่วยเลือกสัตว์เลี้ยง</a
              ><a href="favorites.html">รายการโปรด</a>
            </div>
            <div class="nav-actions" id="nav-auth">
              <a class="nav-login" href="login.html">เข้าสู่ระบบ</a
              ><a class="nav-register" href="register.html">สมัครสมาชิก</a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="container">
      <div class="page-title">
        <p class="eyebrow">PET FINDER</p>
        <h1>สัตว์เลี้ยงที่เหมาะกับฉัน</h1>
        <p>ตอบคำถามสั้น ๆ แล้วระบบจะกรองสัตว์เลี้ยงตามความต้องการของคุณ</p>
      </div>
      <div class="finder">
        <label
          >ต้องการความยากในการเลี้ยงระดับไหน?<select id="difficulty">
            <option value="">ไม่จำกัด</option>
            <option>ง่าย</option>
            <option>ปานกลาง</option>
            <option>ยาก</option>
          </select></label
        >
        <label
          >ขนาดสัตว์ที่ต้องการ?<select id="size">
            <option value="">ไม่จำกัด</option>
            <option>เล็ก</option>
            <option>กลาง</option>
            <option>ใหญ่</option>
          </select></label
        >
        <label
          >พลังงานที่เหมาะกับคุณ?<select id="energy">
            <option value="">ไม่จำกัด</option>
            <option>ต่ำ</option>
            <option>ปานกลาง</option>
            <option>สูง</option>
          </select></label
        >
        <label
          >ประเภทสัตว์ที่สนใจ?<select id="category">
            <option value="">ไม่จำกัด</option>
          </select></label
        >
        <button class="btn btn-primary" onclick="findPets()">
          ค้นหาสัตว์ที่เหมาะกับฉัน
        </button>
      </div>
      <div id="result" class="pet-grid"></div>
    </main>
    <footer>© 2026 PetGuide</footer>
    <script src="/js/app.js"></script>
    <script>
      (async () => {
        await loadAuthNav();
        const c = await fetchJSON("/api/categories");
        category.innerHTML += c
          .map((x) => `<option>${escapeHtml(x.name)}</option>`)
          .join("");
      })();
      async function findPets() {
        const p = new URLSearchParams();
        ["difficulty", "size", "energy", "category"].forEach((x) => {
          if (document.getElementById(x).value)
            p.set(x, document.getElementById(x).value);
        });
        const pets = await fetchJSON("/api/pets?" + p);
        result.innerHTML = pets.length
          ? pets.map(petCard).join("")
          : "<div class='empty'>ยังไม่พบสัตว์ที่ตรงกับเงื่อนไข</div>";
      }
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const c = location.pathname.split("/").pop() || "index.html";
        document.querySelectorAll(".site-navbar .nav-main a").forEach((a) => {
          if (a.getAttribute("href") === c) a.classList.add("active");
        });
      });
    </script>
  </body>
</html>
