<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>รายการโปรด | PetGuide</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <nav class="site-navbar">
        <div class="nav-inner">
          <a class="brand" href="index.html"
            ><span class="brand-mark">🐾</span
            ><span
              ><strong>PetGuide</strong
              ><small>คู่มือเลือกสัตว์เลี้ยง</small></span
            ></a
          >
          <button
            class="nav-toggle"
            type="button"
            aria-label="เปิดเมนู"
            onclick="document.body.classList.toggle('nav-open')"
          >
            <span></span><span></span><span></span>
          </button>
          <div class="nav-menu">
            <div class="nav-main">
              <a href="index.html">หน้าแรก</a><a href="pets.html">สายพันธุ์</a
              ><a href="recommend.html">ช่วยเลือกสัตว์เลี้ยง</a
              ><a href="favorites.html">รายการโปรด</a>
            </div>
            <div class="nav-actions" id="nav-auth">
              <a class="nav-login" href="login.html">เข้าสู่ระบบ</a
              ><a class="nav-register" href="register.html">สมัครสมาชิก</a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="container">
      <div class="page-title"><h1>สัตว์เลี้ยงที่ฉันสนใจ</h1></div>
      <div id="list" class="pet-grid"></div>
    </main>
    <footer>© 2026 PetGuide</footer>
    <script src="/js/app.js"></script>
    <script>
      (async () => {
        if (!getUser()) {
          location.href = "/login.html";
          return;
        }
        await loadAuthNav();
        const p = await api("/api/favorites");
        list.innerHTML = p.length
          ? p.map(petCard).join("")
          : "<div class='empty'>ยังไม่มีรายการโปรด</div>";
      })();
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const c = location.pathname.split("/").pop() || "index.html";
        document.querySelectorAll(".site-navbar .nav-main a").forEach((a) => {
          if (a.getAttribute("href") === c) a.classList.add("active");
        });
      });
    </script>
  </body>
</html>
