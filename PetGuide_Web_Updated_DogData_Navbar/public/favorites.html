<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>รายการโปรด | PetGuide</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <nav class="site-navbar">
        <div class="nav-inner">
          <a class="brand" href="index.html">
            <span class="brand-mark">🐾</span>
            <span><strong>PetGuide</strong><small>คู่มือเลือกสัตว์เลี้ยง</small></span>
          </a>
          <button class="nav-toggle" type="button" aria-label="เปิดเมนู" onclick="document.body.classList.toggle('nav-open')">
            <span></span><span></span><span></span>
          </button>
          <div class="nav-menu">
            <div class="nav-main">
              <a href="index.html">หน้าแรก</a>
              <a href="pets.html">สายพันธุ์</a>
              <a href="recommend.html">ช่วยเลือกสัตว์เลี้ยง</a>
              <a href="favorites.html">รายการโปรด</a>
            </div>
            <div class="nav-actions" id="nav-auth"></div>
          </div>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="page-title"><h1>สัตว์เลี้ยงที่ฉันสนใจ</h1></div>
      <div id="list" class="pet-grid"></div>
    </main>

    <footer>© 2026 PetGuide</footer>
    <script src="/js/app.js"></script>
    <script>
      (async () => {
        await loadAuthNav();
        const user = getUser();
        
        // ถ้าผู้ใช้ยังไม่เข้าสู่ระบบ ให้แสดงข้อความแจ้งเตือนแทนการเตะไปหน้า login
        if (!user) {
          document.getElementById("list").innerHTML = `
            <div class="empty" style="grid-column: 1/-1; text-align: center; padding: 40px;">
              <h2>สำหรับสมาชิกเท่านั้น</h2>
              <p style="color: #6d7f76; margin-bottom: 20px;">กรุณาเข้าสู่ระบบหรือสมัครสมาชิกเพื่อดูและบันทึกรายการโปรดของคุณ</p>
              <a href="login.html" class="btn btn-primary">เข้าสู่ระบบ</a>
              <a href="register.html" class="btn btn-light">สมัครสมาชิก</a>
            </div>
          `;
          return;
        }

        // กรณีเข้าสู่ระบบแล้ว ให้ดึงข้อมูลรายการโปรดปกติ
        try {
          const p = await api("/api/favorites");
          document.getElementById("list").innerHTML = p.length
            ? p.map(petCard).join("")
            : "<div class='empty' style='grid-column: 1/-1;'>ยังไม่มีรายการโปรด</div>";
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
  </body>
</html>
