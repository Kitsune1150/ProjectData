<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>รายการโปรด | Petty Boo</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .pet-card {
      position: relative;
    }

    /* ปุ่มกากบาทมุมขวาบน */
    .btn-remove-fav {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      background-color: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .btn-remove-fav:hover {
      background-color: #e63946;
      transform: scale(1.1);
    }

    /* ซ่อนปุ่มหัวใจในหน้ารายการโปรด */
    .pet-card .btn-fav {
      display: none !important;
    }
  </style>
</head>

<body>
  <header>
    <nav class="site-navbar">
      <div class="nav-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark">🐾</span>
          <span><strong>Petty Boo</strong><small>คู่มือเลือกสัตว์เลี้ยง</small></span>
        </a>
        <button class="nav-toggle" type="button" aria-label="เปิดเมนู"
          onclick="document.body.classList.toggle('nav-open')">
          <span></span><span></span><span></span>
        </button>
        <div class="nav-menu">
          <div class="nav-main">
            <a href="index.html">หน้าแรก</a>
            <a href="pets.html">สายพันธุ์</a>
            <a href="recommend.html">ช่วยเลือกสัตว์เลี้ยง</a>
            <a href="favorites.html">รายการโปรด</a>
            <a href="community.html">ชุมชน</a>
          </div>
          <div class="nav-actions" id="nav-auth"></div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="page-title">
      <h1>สัตว์เลี้ยงที่ฉันสนใจ</h1>
    </div>
    <p id="favorite-message" class="favorite-action-message" role="status" aria-live="polite" tabindex="-1"></p>
    <div id="list" class="pet-grid"></div>
  </main>

  <div id="favorite-remove-dialog" class="admin-confirm-overlay" hidden>
    <section class="admin-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="favorite-remove-title" aria-describedby="favorite-remove-description">
      <div class="admin-confirm-icon" aria-hidden="true">&#x2661;</div>
      <h2 id="favorite-remove-title">&#x0e19;&#x0e33;&#x0e2d;&#x0e2d;&#x0e01;&#x0e08;&#x0e32;&#x0e01;&#x0e23;&#x0e32;&#x0e22;&#x0e01;&#x0e32;&#x0e23;&#x0e42;&#x0e1b;&#x0e23;&#x0e14;</h2>
      <p id="favorite-remove-description">&#x0e04;&#x0e38;&#x0e13;&#x0e15;&#x0e49;&#x0e2d;&#x0e07;&#x0e01;&#x0e32;&#x0e23;&#x0e19;&#x0e33;&#x0e2a;&#x0e31;&#x0e15;&#x0e27;&#x0e4c;&#x0e19;&#x0e35;&#x0e49;&#x0e2d;&#x0e2d;&#x0e01;&#x0e08;&#x0e32;&#x0e01;&#x0e23;&#x0e32;&#x0e22;&#x0e01;&#x0e32;&#x0e23;&#x0e42;&#x0e1b;&#x0e23;&#x0e14;&#x0e2b;&#x0e23;&#x0e37;&#x0e2d;&#x0e44;&#x0e21;&#x0e48;</p>
      <p id="favorite-remove-error" class="admin-confirm-error" role="alert" hidden></p>
      <div class="admin-confirm-actions">
        <button type="button" id="cancel-favorite-remove" class="btn btn-light">&#x0e22;&#x0e31;&#x0e07;&#x0e40;&#x0e01;&#x0e47;&#x0e1a;&#x0e44;&#x0e27;&#x0e49;</button>
        <button type="button" id="confirm-favorite-remove" class="btn admin-delete-post">&#x0e19;&#x0e33;&#x0e2d;&#x0e2d;&#x0e01;</button>
      </div>
    </section>
  </div>
  <footer>© 2026 Petty Boo</footer>
  <script src="/js/app.js"></script>
  <script>
    // ฟังก์ชัน Render การ์ดคู่กับปุ่มกากบาท
    function renderFavoriteCard(pet) {
      // ดึงค่า id ให้ชัวร์ว่าไม่เป็น undefined
      const petId = pet.id || pet._id;

      const cardContent = typeof petCard === 'function' ? petCard(pet) : `
          <img src="${pet.image || ''}" alt="${pet.name}">
          <div class="pet-card-body">
            <h3>${pet.name}</h3>
            <p>${pet.description || ''}</p>
          </div>
        `;

      // ส่ง `this` เข้าไปใน removeFavorite เพื่อใช้อ้างอิงปุ่มที่ถูกกดโดยตรง
      return `
          <div class="pet-card">
            <button class="btn-remove-fav" onclick="removeFavorite(event, '${petId}', this)" title="ยกเลิกรายการโปรด">✕</button>
            ${cardContent}
          </div>
        `;
    }

    // โหลดข้อมูลรายการโปรด
    async function loadFavorites() {
      const listEl = document.getElementById("list");
      try {
        const pets = await api("/api/favorites");
        if (pets && pets.length > 0) {
          listEl.innerHTML = pets.map(renderFavoriteCard).join("");
        } else {
          listEl.innerHTML = `<div class="empty" style="grid-column: 1/-1; text-align: center; padding: 40px;">ยังไม่มีรายการโปรด</div>`;
        }
      } catch (e) {
        console.error(e);
        listEl.innerHTML = `<div class="empty" style="grid-column: 1/-1; text-align: center; color: red;">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
      }
    }

    // ฟังก์ชันกดยกเลิกชอบ (ใช้ btnTarget ลบการ์ดใบที่กดโดยตรง)
    const favoriteDialog = document.getElementById("favorite-remove-dialog");
    const favoriteRemoveDescription = document.getElementById("favorite-remove-description");
    const favoriteRemoveError = document.getElementById("favorite-remove-error");
    const confirmFavoriteRemove = document.getElementById("confirm-favorite-remove");
    let favoritePendingRemoval = null;

    function closeFavoriteRemoveDialog(restoreFocus = true) {
      favoriteDialog.hidden = true;
      document.body.classList.remove("dialog-open");
      favoriteRemoveError.hidden = true;
      confirmFavoriteRemove.disabled = false;
      const target = favoritePendingRemoval?.button;
      favoritePendingRemoval = null;
      if (restoreFocus && target?.isConnected) target.focus();
    }

    function removeFavorite(event, petId, btnTarget) {
      event.stopPropagation();
      favoritePendingRemoval = { petId, button: btnTarget };
      favoriteRemoveDescription.textContent = btnTarget.closest(".pet-card")?.querySelector("h3")?.textContent || "This favorite";
      favoriteRemoveError.hidden = true;
      favoriteDialog.hidden = false;
      document.body.classList.add("dialog-open");
      document.getElementById("cancel-favorite-remove").focus();
    }

    async function confirmRemoveFavorite() {
      if (!favoritePendingRemoval || confirmFavoriteRemove.disabled) return;
      const { petId, button } = favoritePendingRemoval;
      confirmFavoriteRemove.disabled = true;
      favoriteRemoveError.hidden = true;
      try {
        const result = await api("/api/favorites/" + encodeURIComponent(petId), { method: "DELETE", silent: true });
        const cardEl = button.closest(".pet-card");
        if (cardEl) cardEl.remove();
        favoriteIds.delete(petId);
        const listEl = document.getElementById("list");
        if (!listEl.querySelector(".pet-card")) {
          listEl.innerHTML = '<div class="empty" style="grid-column: 1/-1; text-align: center; padding: 40px;">&#x0e22;&#x0e31;&#x0e07;&#x0e44;&#x0e21;&#x0e48;&#x0e21;&#x0e35;&#x0e23;&#x0e32;&#x0e22;&#x0e01;&#x0e32;&#x0e23;&#x0e42;&#x0e1b;&#x0e23;&#x0e14;</div>';
        }
        const message = document.getElementById("favorite-message");
        message.textContent = result.message;
        closeFavoriteRemoveDialog(false);
        message.focus();
      } catch (error) {
        favoriteRemoveError.textContent = error.message || "Could not remove this favorite. Please try again.";
        favoriteRemoveError.hidden = false;
        confirmFavoriteRemove.disabled = false;
      }
    }

    document.getElementById("cancel-favorite-remove").addEventListener("click", () => closeFavoriteRemoveDialog());
    confirmFavoriteRemove.addEventListener("click", confirmRemoveFavorite);
    favoriteDialog.addEventListener("click", (event) => {
      if (event.target === favoriteDialog) closeFavoriteRemoveDialog();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !favoriteDialog.hidden) closeFavoriteRemoveDialog();
    });

    (async () => {
      await loadAuthNav();
      const user = getUser();

      if (!user) {
        document.getElementById("list").innerHTML = `
            <div class="empty" style="grid-column: 1/-1; text-align: center; padding: 40px;">
              <h2>สำหรับสมาชิกเท่านั้น</h2>
              <p style="color: #6d7f76; margin-bottom: 20px;">กรุณาเข้าสู่ระบบหรือสมัครสมาชิกเพื่อดูและบันทึกรายการโปรดของคุณ</p>
              <a href="login.html" class="btn btn-primary">เข้าสู่ระบบ</a>
              <a href="register.html" class="btn btn-light">สมัครสมาชิก</a>
            </div>
          `;
        return;
      }

      await loadFavorites();
    })();

    // Active Navbar Highlight
    document.addEventListener("DOMContentLoaded", () => {
      const c = location.pathname.split("/").pop() || "index.html";
      document.querySelectorAll(".site-navbar .nav-main a").forEach((a) => {
        if (a.getAttribute("href") === c) a.classList.add("active");
      });
    });
  </script>
</body>

</html>
