<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>โปรไฟล์ของฉัน | PetGuide</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <nav class="site-navbar">
        <div class="nav-inner">
          <a class="brand" href="index.html">
            <span class="brand-mark">🐾</span>
            <span><strong>PetGuide</strong><small>คู่มือเลือกสัตว์เลี้ยง</small></span>
          </a>
          <button class="nav-toggle" type="button" aria-label="เปิดเมนู" onclick="document.body.classList.toggle('nav-open')">
            <span></span><span></span><span></span>
          </button>
          <div class="nav-menu">
            <div class="nav-main">
              <a href="index.html">หน้าแรก</a>
              <a href="pets.html">สายพันธุ์</a>
              <a href="recommend.html">ช่วยเลือกสัตว์เลี้ยง</a>
              <a href="favorites.html">รายการโปรด</a>
            </div>
            <div class="nav-actions" id="nav-auth"></div>
          </div>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="page-title">
        <p class="eyebrow">USER PROFILE</p>
        <h1>ข้อมูลโปรไฟล์</h1>
      </div>

      <div class="panel" style="max-width: 600px; margin: 0 auto;">
        <div id="profile-info">
          <p>กำลังโหลดข้อมูล...</p>
        </div>
      </div>
    </main>

    <footer>© 2026 PetGuide</footer>
    <script src="/js/app.js"></script>
    <script>
      (async () => {
        await loadAuthNav();
        const u = getUser();
        if (!u) {
          location.href = "login.html";
          return;
        }

        try {
          // ดึงข้อมูลผู้ใช้ล่าสุดจากเซิร์ฟเวอร์
          const me = await api("/api/auth/me");
          document.getElementById("profile-info").innerHTML = `
            <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
              <div style="font-size: 50px; background: #eaf6ef; border-radius: 50%; width: 80px; height: 80px; display: grid; place-items: center;">👤</div>
              <div>
                <h2 style="margin: 0;">${escapeHtml(me.username)}</h2>
                <span class="badge" style="margin-top: 5px;">สิทธิ์ใช้งาน: ${me.role === 'admin' ? 'ผู้ดูแลระบบ (Admin)' : 'สมาชิกทั่วไป (User)'}</span>
              </div>
            </div>
            <hr style="border: 0; border-top: 1px solid #dce9e2; margin: 20px 0;" />
            <div style="display: grid; gap: 12px; font-size: 1rem;">
              <div><strong>📧 อีเมล:</strong> ${escapeHtml(me.email)}</div>
              <div><strong>📅 วันที่สมัครสมาชิก:</strong> ${me.createdAt ? new Date(me.createdAt).toLocaleDateString("th-TH") : '-'}</div>
            </div>
            <div style="margin-top: 30px; display: flex; gap: 10px;">
              <a href="favorites.html" class="btn btn-primary">ดูรายการโปรดของฉัน</a>
              <button class="btn btn-light" onclick="logout()">ออกจากระบบ</button>
            </div>
          `;
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
  </body>
</html>
